services:
  db:
    image: postgis/postgis:16-3.4
    container_name: pyrosync-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pyrosync
      POSTGRES_USER: pyrosync
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pyrosync_pgdata:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=32MB
      - -c
      - max_wal_size=1GB
      - -c
      - random_page_cost=1.1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pyrosync -d pyrosync"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pyrosync_pgdata:
