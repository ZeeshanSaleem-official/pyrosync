services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: pyrosync
      POSTGRES_USER: pyrosync
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dbdata:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=2GB
      - -c
      - work_mem=32MB
      - -c
      - max_wal_size=2GB
      - -c
      - random_page_cost=1.1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pyrosync -d pyrosync"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://pyrosync:${DB_PASSWORD}@db:5432/pyrosync?sslmode=disable
      FIRMS_MAP_KEY: ${FIRMS_MAP_KEY}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      HTTP_ADDR: ":8080"
      INGEST_INTERVAL_MIN: ${INGEST_INTERVAL_MIN:-60}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ../data:/data:ro

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../web/out:/srv/web:ro
      - caddydata:/data
      - caddyconfig:/config

volumes:
  dbdata:
  caddydata:
  caddyconfig:
